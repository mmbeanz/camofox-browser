name: dev-ci

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Also run live network tests (Google/Amazon)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin (TypeScript → JS)
        run: npm run build

      - name: Verify standalone MCP package
        run: npm run test:mcp

      - name: Audit standalone MCP package
        run: |
          npm ci --prefix mcp --ignore-scripts
          npm audit --prefix mcp --omit=dev

      - name: Run unit + plugin tests (Jest)
        run: |
          npm install --no-save jest-junit
          node --experimental-vm-modules node_modules/.bin/jest \
            --testPathPatterns='tests/unit|plugins' \
            --testPathIgnorePatterns='security\.test|tabRecycling\.test|cookies\.test|timeoutContinuation\.test|operationalFailures\.test|tabLifecycleContract\.test' \
            --forceExit
        env:
          CI: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save jest-junit

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox

      - name: Install browser system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox

      - name: Run e2e + browser-dependent unit tests
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --config jest.config.e2e.cjs \
              --runInBand --forceExit
        env:
          CI: true

      - name: Run browser-dependent unit tests
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --testPathPatterns='tests/unit/(security|tabRecycling|cookies|timeoutContinuation|operationalFailures|tabLifecycleContract)\.test' \
              --runInBand --forceExit
        env:
          CI: true

  live:
    if: inputs.run_live == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save jest-junit

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox

      - name: Install browser system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox

      - name: Run live network tests
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --testPathPatterns='tests/live' \
              --runInBand --forceExit
        env:
          CI: true
          RUN_LIVE_TESTS: 1
